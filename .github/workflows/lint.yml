name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: "Ruff lint and format"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Ruff check"
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "./report-generator"

      - name: "Ruff format check"
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          src: "./report-generator"